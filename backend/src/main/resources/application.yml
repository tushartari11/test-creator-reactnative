server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: test-creator

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:testcreator}
    username: ${DB_USERNAME:testcreator_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 7200000 # 2 hours default
      cache-null-values: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters-required}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

# Logging
logging:
  level:
    root: INFO
    com.testcreator: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_PATH:/app/logs}/test-creator.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    title: Test Creator API Documentation
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: list
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    show-common-extensions: true
    use-root-path: false
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui.use-base-path: true

# Application Specific
app:
  name: Online Test Creator
  version: 0.0.1-SNAPSHOT
  description: High-performance online examination platform with proctoring
  base-url: ${BASE_URL:http://localhost:8080}
  guest:
    token-expiry-hours: ${GUEST_TOKEN_EXPIRY_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  rate-limit:
    enabled: true
    default-limit: 1000 # requests per hour
    auth-limit: 5 # login attempts per minute

# Proctoring Configuration
proctoring:
  max-violations: ${PROCTORING_MAX_VIOLATIONS:10}
  max-critical-violations: ${PROCTORING_MAX_CRITICAL:3}
  max-tab-switches: ${PROCTORING_MAX_TAB_SWITCHES:5}
  heartbeat-interval-seconds: ${PROCTORING_HEARTBEAT_INTERVAL:10}
  heartbeat-timeout-seconds: ${PROCTORING_HEARTBEAT_TIMEOUT:30}
